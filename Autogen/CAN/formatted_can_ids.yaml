DTI Control 1:
  id: 116
  length: 2
  signals:
    - name: "Target AC Current"
      bit_start: 0
      byte: 0-2
      description: "This command sets the target motor AC current (peak, not RMS). When the controller receives this message, it automatically switches to current control mode. This value must not be above the limits of the inverter and must be multiplied by 10 before sending. This is a signed parameter, and the sign represents the direction of the torque which correlates with the motor AC current. (For the correlation, please refer to the motor parameters)"

DTI Control 2:
  id: 216
  length: 2
  signals:
    - name: "Target Brake Current"
      bit_start: 0
      byte: 0-2
      description: "Targets the brake current of the motor. It will result negative torque relatively to the forward direction of the motor. This value must be multiplied by 10 before sending, only positive currents are accepted."

DTI Control 3:
  id: 316
  length: 4
  signals:
    - name: "Target ERPM"
      bit_start: 0
      byte: 0-3
      description: "This command enables the speed control of the motor with a target ERPM. This is a signed parameter, and the sign represents the direction of the spinning. For better operation you need to tune the PID of speed control. Equation: ERPM = Motor RPM * number of the motor pole pairs"

DTI Control 4:
  id: 416
  length: 2
  signals:
    - name: "Target Position"
      bit_start: 0
      byte: 0-2
      description: "This value targets the desired position of the motor in degrees. This command is used to hold a position of the motor. This feature is enabled only if encoder is used as position sensor. The value has to be multiplied by 10 before sending."

DTI Control 5:
  id: 516
  length: 2
  signals:
    - name: "R-AC Current"
      bit_start: 0
      byte: 0-2
      description: "This command sets a relative AC current to the minimum and maximum limits set by configuration. This achieves the same function as the “Set AC current” command. Gives you a freedom to send values between -100,0% and 100,0%. You do not need to know the motor limit parameters. This value must be between -100 and 100 and must be multiplied by 10 before sending."

DTI Control 6:
  id: 616
  length: 2
  signals:
    - name: "R-AC Brake Current"
      bit_start: 0
      byte: 0-2
      description: "Targets the relative brake current of the motor. It will result negative torque relatively to the forward direction of the motor. This value must be between 0 and 100 and must be multiplied by 10 before sending Gives you a freedom to send values between 0% and 100,0%. You do not need to know the motor limit parameters. This value must be between 0 and 100 and has to be multiplied by 10 before sending"

DTI Control 7:
  id: 716
  length: 1
  signals:
    - name: "Digital Output 1"
      bit_start: 0
      byte: 0
      description: "Sets the digital output 1 to HIGH (1) or LOW (0) state"
    - name: "Digital Output 2"
      bit_start: 1
      description: "Sets the digital output 1 to HIGH (1) or LOW (0) state"
    - name: "Digital Output 3"
      bit_start: 2
      description: "Sets the digital output 1 to HIGH (1) or LOW (0) state"
    - name: "Digital Output 4"
      bit_start: 3
      description: "Sets the digital output 1 to HIGH (1) or LOW (0) state"

DTI Control 8:
  id: 816
  length: 2
  signals:
    - name: "Max AC Current"
      bit_start: 0
      byte: 0-2
      description: "This value determines the maximum allowable drive current on the AC side. With this function you are able maximize the maximum torque on the motor. The value must be multiplied by 10 before sending."

DTI Control 9:
  id: 916
  length: 2
  signals:
    - name: "Max Brake AC Current"
      bit_start: 0
      byte: 0-2
      description: "This value sets the maximum allowable brake current on the AC side. This value must be multiplied by 10 before sending, only negative currents are accepted."

DTI Control 10:
  id: A16
  length: 2
  signals:
    - name: "Max DC Current"
      bit_start: 0
      byte: 0-2
      description: "This value determines the maximum allowable drive current on the DC side. With this command the BMS can limit the maximum allowable battery discharge current. The value has to be multiplied by 10 before sending."

DTI Control 11:
  id: B16
  length: 2
  signals:
    - name: "Max Brake DC Current"
      bit_start: 0
      byte: 0-2
      description: "This value determines the maximum allowable brake current on the DC side. With this command the BMS can limit the maximum allowable battery charge current. The value has to be multiplied by 10 before sending. Only negative currents are accepted."

DTI Control 12:
  id: C16
  length: 1
  signals:
    - name: "Drive Enable"
      bit_start: 0
      byte: 0
      description: "0: Drive not allowed 1: Drive allowed Only 0 and 1 values are accepted. Must be sent periodically to be enabled."

DTI Data 1:
  id: 2016
  length: 8
  signals:
    - name: "ERPM"
      bit_start: 0
      byte: 0-3
      description: "Electrical RPM Equation: ERPM = Motor RPM * number of the motor pole pairs."
    - name: "Duty Cycle"
      bit_start: 32
      byte: 4-5
      description: "The controller duty cycle. The sign of this value will represent whether the motor is running(positive) current or regenerating (negative) current."
    - name: "Input Voltage"
      bit_start: 48
      byte: 6-7
      description: "Input voltage is the DC voltage."

DTI Data 2:
  id: 2116
  length: 8
  signals:
    - name: "AC Current"
      bit_start: 0
      byte: 0-1
      description: "The motor current. The sign of this value represents whether the motor is running(positive) current or regenerating (negative) current."
    - name: "DC Current"
      bit_start: 16
      byte: 2-3
      description: "DC Current: Current on DC side. The sign of this value represents whether the motor is running(positive) current or regenerating (negative) current."
    - name: "RESERVED"
      bit_start: 32
      byte: 4-7
      description: "Filled with FF’s. For future use."

DTI Data 3:
  id: 2216
  length: 8
  signals:
    - name: "Controller Temp"
      bit_start: 0
      byte: 0-1
      description: "Temperature of the inverter semiconductors."
    - name: "Motor Temp"
      bit_start: 16
      byte: 2-3
      description: "Temperature of the motor measured by the inverter"
    - name: "Fault Codes"
      bit_start: 32
      byte: 4
      description: "0x00 : NO FAULTS 0x01 : Overvoltage - The input voltage is higher than the set maximum. 0x02 : Undervoltage - The input voltage is lower than the set minimum. 0x03 : DRV - Transistor or transistor drive error 0x04 : ABS. Overcurrent - The AC current is higher than the set absolute maximum current. 0x05 : CTLR Overtemp. - The controller temperature is higher than the set maximum. 0x06 : Motor Overtemp. - The motor temperature is higher than the set maximum. 0x07 : Sensor wire fault - Something went wrong with the sensor differential signals. 0x08 : Sensor general fault - An error occurred while processing the sensor signals 0x09 : CAN Command error - CAN message received contains parameter out of boundaries 0x0A : Analog input error – Redundant output out of range"
    - name: "RESERVED"
      bit_start: 40
      byte: 5-7
      description: "Filled with FF’s. For future use."

DTI Data 4:
  id: 2316
  length: 8
  signals:
    - name: "FOC Id"
      bit_start: 0
      byte: 0-3
      description: "FOC algorithm component Id."
    - name: "FOC Iq"
      bit_start: 32
      byte: 4-7
      description: "FOC algorithm component Id\q."

DTI Data 5:
  id: 2416
  length: 8
  signals:
    - name: "Throttle"
      bit_start: 0
      byte: 0
      description: "Throttle signal derived from analog inputs or CAN2"
    - name: "Brake"
      bit_start: 8
      byte: 1
      description: "Brake signal derived from analog inputs or CAN2"
    - name: "Digital input 1"
      bit_start: 16
      byte: 2
      description: "1: Digital input is active 0: Digital input is inactive"
    - name: "Digital input 2"
      bit_start: 17
    - name: "Digital input 3"
      bit_start: 18
    - name: "Digital input 4"
      bit_start: 19
    - name: "Digital output 1"
      bit_start: 20
      description: "1: Digital output is active 0: Digital output is inactive"
    - name: "Digital output 2"
      bit_start: 21
    - name: "Digital output 3"
      bit_start: 22
    - name: "Digital output 4"
      bit_start: 23
    - name: "Drive Enable"
      bit_start: 24
      byte: 3
      description: "1: Drive enabled 0: Drive disabled Drive can be enabled/disbled by the digital input or/and via CAN2 interface"
    - name: "Capacitor temp limit"
      bit_start: 32
      byte: 4
      description: "1: Capacitor temperature limit active 0: Capacitor temperature limit inactive The inverter can limit the output power to not to overheat the internal capacitors. (only valid HW version 3.6 or newer)"
    - name: "DC current limit"
      bit_start: 33
      description: "1: DC current limit active 0: DC current limit inactive"
    - name: "Drive enable limit"
      bit_start: 34
      description: "1: Drive enable limit active 0: Drive enable limit inactive Indicates whether the drive enable limitation is active or inactive. Used for software development purposes. For true indication of the drive state please use byte 3, bit 24 of this message."
    - name: "IGBT acceleration
temperature limit"
      bit_start: 35
      description: "1: IGBT acceleration limit active 0: IGBT acceleration limit inactive"
    - name: "IGBT temperature
limit"
      bit_start: 36
      description: "1: IGBT temperature limit active 0: IGBT temperature limit inactive"
    - name: "Input voltage limit"
      bit_start: 37
      description: "1: Input voltage limit active 0: Input voltage limit inactive"
    - name: "Motor acceleration
temperature limit"
      bit_start: 38
      description: "1: Motor acceleration temperature limit active 0: Motor acceleration temperature limit inactive"
    - name: "Motor temperature
limit"
      bit_start: 39
      description: "1: Motor temperature limit active 0: Motor temperature limit inactive"
    - name: "RPM min limit"
      bit_start: 40
      byte: 5
      description: "1: RPM min limit active 0: RPM min limit inactive"
    - name: "RPM max limit"
      bit_start: 41
      description: "1: RPM max limit active 0: RPM max limit inactive"
    - name: "Power limit"
      bit_start: 42
      description: "1: Power limit by configuration active 0: Power limit by configuration inactive"
    - name: "RESERVED"
      bit_start: 43
      description: "Set to 0."
    - name: "RESERVED"
      bit_start: 48
      byte: 6
      description: "Filled with FF’s. For future use."
    - name: "CAN Version"
      bit_start: 56
      byte: 7
      description: "Indicates the CAN map version. For ex: 23 -> 2,3 (V2,3)"

IMD general:
  id: 18FF01F4
  length: 8
  signals:
    - name: "R_Iso_Corrected"
      bit_start: 0
      byte: 0-1
    - name: "R_Iso_Status"
      bit_start: 16
      byte: 2
    - name: "Iso_Meas_Count"
      bit_start: 24
      byte: 3
    - name: "Status"
      bit_start: 32
      byte: 4-5
      description: "Bit 0: true = Device error active Bit 1: true = HV_pos connection failure Bit 2: true = HV_neg connection failure Bit 3: true = Earth connection failure Bit 4: true = Iso Alarm (iso value below threshold error) Bit 5: true = Iso Warning (iso value below threshold warning) Bit 6: true = Iso Outdated (value „Time elapsed since lst measurement“ > = „measurement timeout“) Bit 7: true = Unbalance Alarm (unbalance value below threshold) Bit 8: true = Undervoltage Alarm Bit 9: true = Unsafe to Start Bit 10: true = Earthlift open"
    - name: "Activity"
      bit_start: 48
      byte: 6
    - name: "RESERVED"
      bit_start: 56
      byte: 7
      description: "Filled with FF’s"

