Message ID:
  ECU Status 1: 
    MSG ID: 0x003
    MSG LENGTH: 8
    ECU State: # bit start 0
      data type: u8
      units: Enum
    # See: https://wiki.gauchoracing.com/link/189#bkmrk-state-machine
    ACU Node Status: # [1: OK, 0: Timeout] - bit start: 8
      data type: byte
      units: Bool
    GR Inv 1 Status: # [1: OK, 0: Timeout] - bit start: 9
      data type: byte
      units: Bool
    GR Inv 2 Status:  # [1: OK, 0: Timeout] - bit start: 10 
      data type: byte
      units: Bool
    GR Inv 3 Status:  # [1: OK, 0: Timeout] - bit start: 11 
      data type: byte 
      units: Bool
    GR Inv 4 Status:  # [1: OK, 0: Timeout] - bit start: 12
      data type: byte
      units: Bool
    Fan Controller 1:  # [1: OK, 0: Timeout] - bit start: 13
      data type: byte
      units: Bool
    Fan Controller 2:  # [1: OK, 0: Timeout] - bit start: 14
      data type: byte
      units: Bool
    Fan Controller 3:  # [1: OK, 0: Timeout] - bit start: 15
      data type: byte
      units: Bool
    Fan Controller 4:  # [1: OK, 0: Timeout] - bit start: 16
      data type: byte
      units: Bool
    Fan Controller 5:  # [1: OK, 0: Timeout] - bit start: 17
      data type: byte
      units: Bool
    Fan Controller 6:  # [1: OK, 0: Timeout] - bit start: 18
      data type: byte
      units: Bool
    Fan Controller 7:  # [1: OK, 0: Timeout] - bit start: 19
      data type: byte
      units: Bool
    Fan Controller 8:  # [1: OK, 0: Timeout] - bit start: 20
      data type: byte
      units: Bool
    Dash:  # [1: OK, 0: Timeout] - bit start: 21
      data type: byte
      units: Bool
    Steering:  # [1: OK, 0: Timeout] - bit start: 22 
      data type: byte
      units: Bool
    Reserved:  # bit start: 23
    # Controls the AC current limits to each of the inverters
    # Discrete Mapping, actual values TBD (16 possible values)
    Power level:  # bit start: 32
      data type: u4
    # The torque map selected; torque map is the mapping of the throttle to the torque sent to each motor
    Torque:  # bit start: 36
      data type: u4
    # the temperature of the hottest cell of the accumulator
    Max Cel Temp:  # bit start: 40
      data type: u8
      scaled min: 0
      scaled max: 63.75
      map equation: ".25x"
      units: Celsius
    # % charged of the Accumulator
    Accumulator State of Charge:  # bit start: 48 
      data type: u8
      scaled min: 0
      scaled max: 100
      map equation: 20x/51
      units: "%"
    # % charged of the Low Voltage Bat
    GLV State of Charge:  # bit start: 56
      ata type: u8
      scaled min: 0
      scaled max: 100
      map equation: 20x/51
      units: "%"

Custom CAN ID:
   DTI Control 1:
    CAN ID: 116
    Length: 2
    Bit Start: 0
    Data Name: Target AC current
    #This command sets the target motor AC current (peak, not RMS). 
    #When the controller receives this message, it automatically switches to current control mode.
    #This value must not be above the limits of the inverter and mustbe multiplied by 10 before sending. 
    #This is a signed parameter, and the sign represents the direction of the torque which correlates with the motor AC current. 
    #(For the correlation, please refer to the motor parameters)
    
   DTI Control 7:
    CAN ID: 716
    Length: 1
    #Bit Start 0
    Data Name: Digital Output 1 #Sets the digital output 1 to HIGH (1) or LOW (0) state 
    #Bit Start 1
    Data Name: Digital Output 2 #Sets the digital output 1 to HIGH (1) or LOW (0) state 
    #Bit Start 2
    Data Name: Digital Output 3 #Sets the digital output 1 to HIGH (1) or LOW (0) state 
    #Bit Start 3
    Data Name: Digital Output 4 #Sets the digital output 1 to HIGH (1) or LOW (0) state 
    
   DTI Data 5:
    CAN ID: 2416
    Length: 8 
    Byte 0:
      #Bit Start 0
      Data Name: Throttle #Throttle signal derived from analog inputs or CAN2 
    Byte 1:
      #Bit Start 8
      Data Name: Brake #Brake signal derived from analog inputs or CAN2 
    Byte 2:
      #Bit Start 16
      Data Name: Digital Input 1 
      #Bit Start 17
      Data Name: Digital Input 2
      #Bit Start 18
      Data Name: Digital Input 3
      #Bit Start 19
      Data Name: Digital Input 4
      #Bit Start 20
      Data Name: Digital Output 1
      #Bit Start 21
      Data Name: Digital Output 2
      #Bit Start 22
      Data Name: Digital Output 3
      #Bit Start 23
      Data Name: Digital Output 4
    

