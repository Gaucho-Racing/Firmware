byte order: little_endian 

Message ID:
  Debug 2.0:
    MSG ID: 0x000
    MSG LENGTH: 8
    Debug: # bit start 0
      # Essentially a print statement up to 8 bytes long that whichever targeted can parse
      data type: s
  Debug FD:
    MSG ID: 0x001
    MSG LENGTH: 64
    Debug: # bit start 0
      # Essentially a print statement up to 64 bytes long that whichever targeted can parse
      data type: s
  Ping:
    MSG ID: 0x002
    MSG LENGTH: 4
    Timestamp: # bit start 0
      # Time in millis
      data type: u32
      units: ms
      scaled min: 0
      scaled max: 4,294,967,296
      map equation: "1x"
  ECU Status 1:
    MSG ID: 0x003
    MSG LENGTH: 8
    ECU State: # bit start 0
      # See diagram
      data type: u8
      units: Enum
    ACU Node Status: # bit start 8
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    GR Inv 1 Status: # bit start 9
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    GR Inv 2 Status: # bit start 10
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    GR Inv 3 Status: # bit start 11
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    GR Inv 4 Status: # bit start 12
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 1: # bit start 13
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 2: # bit start 14
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 3: # bit start 15
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 4: # bit start 16
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 5: # bit start 17
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 6: # bit start 18
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 7: # bit start 19
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Fan Controller 8: # bit start 20
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Dash: # bit start 21
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Steering: # bit start 22
      # 1: OK, 0: Timeout
      data type: b
      units: Bool
    Reserved: # bit start 23-31
    Power Level: # bit start 32
      # Controls the AC current limits to each of the inverters
      # Discrete Mapping, actual values TBD (16 possible values)
      data type: u4
    Torque Map: # bit start 36
      # The torque map selected; torque map is the mapping of the throttle to the torque sent to each motor
      data type: u4
    Max Cell Temp: # bit start 40
      # the temperature of the hottest cell of the accumulator
      data type: u8
      units: Celsius
      scaled min: 0
      scaled max: 63.75
      map equation: "0.25x"
    Accumulator State of Charge: # bit start 48
      # % charged of the Accumulator
      data type: u8
      units: '%'
      scaled min: 0
      scaled max: 100
      map equation: "20x/51"
    GLV State of Charge: # bit start 56
      # % charged of the Low Voltage Bat
      data type: u8
      units: '%'
      scaled min: 0
      scaled max: 100
      map equation: "20x/51"
  ECU Status 2:
    MSG ID: 0x004
    MSG LENGTH: 8
    Tractive System Voltage: # bit start 0
      # Output terminal voltage of accumulator
      data type: u16
      units: Volts
      scaled min: 0
      scaled max: 655.35
      map equation: "0.01x"
    Vehicle Speed: # bit start 16
      # Absolute value of speed
      data type: u16
      units: MPH
      scaled min: 0
      scaled max: 655.35
      map equation: "0.01x"
    FR Wheel RPM: # bit start 32
      # Wheel RPM
      data type: u16
      units: RPM
      scaled min: -3276.8
      scaled max: 3276.7
      map equation: "0.1x-3276.8"
    FL Wheel RPM: # bit start 48
      # Wheel RPM
      data type: u16
      units: RPM
      scaled min: -3276.8
      scaled max: 3276.7
      map equation: "0.1x-3276.8"
  ECU Status 3:
    MSG ID: 0x005
    MSG LENGTH: 4
    RR Wheel RPM: # bit start 0
      # Wheel RPM
      data type: u16
      units: RPM
      scaled min: -3276.8
      scaled max: 3276.7
      map equation: "0.1x-3276.8"
    RL Wheel RPM: # bit start 16
      # Wheel RPM
      data type: u16
      units: RPM
      scaled min: -3276.8
      scaled max: 3276.7
      map equation: "0.1x-3276.8"
  ECU config:
    MSG ID: 0x006
    MSG LENGTH: 0
    Reserved: # bit start 0
  ACU Status 1:
    MSG ID: 0x007
    MSG LENGTH: 8
    Accumulator Voltage: # bit start 0
      # All cell voltages added up
      data type: u16
      units: Volts
      scaled min: 0
      scaled max: 655.35
      map equation: "0.01x"
    TS Voltage: # bit start 16
      # Output terminal voltage of accumulator
      data type: u16
      units: Volts
      scaled min: 0
      scaled max: 655.35
      map equation: "0.01x"
    Accumulator Current: # bit start 32
      # Current output of accumulator
      data type: i16
      units: Amps
      scaled min: -327.68
      scaled max: 327.67
      map equation: "0.01x"
    Accumulator SOC: # bit start 48
      # Accumulator state of charge (Based on lowest cell)
      data type: u8
      units: '%'
      scaled min: 0
      scaled max: 100
      map equation: "20x/51"
    GLV SOC: # bit start 56
      # GLV state of charge
      data type: u8
      units: '%'
      scaled min: 0
      scaled max: 100
      map equation: "20x/51"
  ACU Status 2:
    MSG ID: 0x008
    MSG LENGTH: 7
    20v Voltage: # bit start 0
      # 20v GLV voltage
      data type: u8
      units: Volts
      scaled min: 0
      scaled max: 25.5
      map equation: "0.1x"
    12v Voltage: # bit start 8
      # 12v supply voltage
      data type: u8
      units: Volts
      scaled min: 0
      scaled max: 25.5
      map equation: "0.1x"
    SDC Voltage: # bit start 16
      # Voltage before ACU Latch
      data type: u8
      units: Volts
      scaled min: 0
      scaled max: 25.5
      map equation: "0.1x"
    Min Cell Voltage: # bit start 24
      # Lowest cell voltage in accumulator
      data type: u8
      units: Volts
      scaled min: 2
      scaled max: 4.55
      map equation: "0.01x+2"
    Max Cell Temp: # bit start 32
      # Hottest cell in accumulator
      data type: u8
      units: Celsius
      scaled min: 0
      scaled max: 63.75
      map equation: "0.25x"
    Over Temp Error: # bit start 40
      # Over temp (>60c)
      data type: b
      units: Bool
    Over Voltage Error: # bit start 41
      # Over voltage (>4.2v per cell)
      data type: b
      units: Bool
    Under Voltage Error: # bit start 42
      # Under voltage (<2.5v per cell)
      data type: b
      units: Bool
    Over Current Error: # bit start 43
      # Over current (discharge)
      data type: b
      units: Bool
    Under Current Error: # bit start 44
      # Over current (charging)
      data type: b
      units: Bool
    Under Voltage 20v Warning: # bit start 45
      # 20v GLV too low (<15?)
      data type: b
      units: Bool
    Under Voltage 12v Warning: # bit start 46
      # 12v supply too low (<10?)
      data type: b
      units: Bool
    Under Voltage SDC Warning: # bit start 47
      # SDC too low (<9?)
      data type: b
      units: Bool
    Precharge Error: # bit start 48
      # Precharge timed out
      data type: b
      units: Bool
    IR- / Precharge State: # bit start 49
      # 0: Open           1: Closed
      data type: b
      units: Bool
    IR+ State: # bit start 50
      # 0: Open           1: Closed
      data type: b
      units: Bool
    Software Latch: # bit start 51
      # 0: Open           1: Closed
      data type: b
      units: Bool
    Reserved: # bit start 52-55
  ACU Status 3:
    MSG ID: 0x009
    MSG LENGTH: 8
    HV Input Voltage: # bit start 0
      # 600v input voltage
      data type: u16
      units: Volts
      scaled min: 0
      scaled max: 655.35
      map equation: "0.01x"
    HV Output Voltage: # bit start 16
      # 20v output voltage
      data type: u16
      units: Volts
      scaled min: 0
      scaled max: 655.35
      map equation: "0.01x"
    HV Input Current: # bit start 32
      # 600v input current
      data type: u16
      units: Amps
      scaled min: 0
      scaled max: 65.535
      map equation: "0.001x"
    HV Output Current: # bit start 48
      # 20v output current
      data type: u16
      units: Amps
      scaled min: 0
      scaled max: 65.535
      map equation: "0.001x"
  ACU Precharge:
    MSG ID: 0x00A
    MSG LENGTH: 1
    Set TS Active: # bit start 0
