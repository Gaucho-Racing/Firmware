name: Linter
run-name: Linter - ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["c", "actions"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13  # v4.35.1
        with:
          languages: ${{ matrix.language }}
          build-mode: 'none'

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: '${{ matrix.language }}'

  configs:
    name: Configuration Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Validate Configuration Files
        uses: kehoecj/validate-configs-action@55242af1509991b2b18e2cf120eb4083a33e5c4b  # v4.0.1

  perllinter:
    name: Perl Linter
    runs-on: ubuntu-slim
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@5a2f3b681f2e2fa0db6cc52c7608d9916527aa58  # v1.40.0
        with:
          install-modules: 'Perl::Critic'

      - name: Perl Critic Output
        run: |
          set -o pipefail
          violations_found=0
          while IFS= read -r file; do
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><code>$file</code></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            if ! perlcritic "$file" 2>&1 | tee -a $GITHUB_STEP_SUMMARY; then
              violations_found=1
            fi
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          done < <(git ls-files '*.pl' '*.pm')
          exit $violations_found

      - name: Perl Critic Annotations
        if: always()
        run: |
          set -o pipefail
          git ls-files '*.pl' '*.pm' \
            | xargs -r perlcritic --verbose '%f:%l:%c:%s:%m (%p)\n' \
            | jq -R -s '
                split("\n")
                | map(
                    select(length > 0)
                    | match("^([^:]+):([^:]+):([^:]+):([^:]+):(.+)$")
                    | (.captures[3].string | tonumber) as $severity
                    | {
                        file: .captures[0].string,
                        line: (.captures[1].string | tonumber),
                        start_column: (.captures[2].string | tonumber),
                        end_column: (.captures[2].string | tonumber),
                        annotation_level: (
                          if $severity == 5 then "failure"
                          elif $severity >= 3 then "warning"
                          else "notice"
                          end
                        ),
                        message: .captures[4].string
                      }
                  )
              ' \
            | tee perlcritic_annotations.json

      - name: Upload Annotations
        if: failure() && github.event_name == 'pull_request'
        uses: yuzutech/annotations-action@00b2d488bcba3bd01014dc073d276ef4a45d5c6c  # v0.6.0
        with:
          title: 'Perl Linter Findings'
          repo-token: ${{ github.token }}
          input: 'perlcritic_annotations.json'

  web:
    name: Web Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@4ea5e57383ed7e14432ebbaae1b64893b7c5210b  # v8.0.0
        with:
          root: 'Web'
          css: 'true'
          log_level: 'DEBUG'

  all:
    name: Completed All Linting
    needs: [ configs, codeql, perllinter, web ]
    runs-on: ubuntu-slim
    permissions: { }
    if: always()
    steps:
      - name: Fail Linting
        if: >
          ${{
            needs.configs.result != 'success' ||
            needs.codeql.result != 'success' ||
            needs.perllinter.result != 'success' ||
            needs.web.result != 'success'
          }}
        run: |
          echo "One or more linting jobs have failed."
          echo "Please check the individual job logs for details."
          exit 1

      - name: Complete Linting
        run: |
          echo "Linting has been completed for all configured linters."
          echo "Please refer to the individual job logs for detailed linting information."
