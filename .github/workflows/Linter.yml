name: clang-tidy

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake ninja-build

    - name: Configure
      run: cmake --preset default
    
    - name: Run clang-tidy
      run: |
        clang-tidy -p build $(git diff --name-only origin/${{ github.base_ref }} | grep '\.cpp$') || exit 1
