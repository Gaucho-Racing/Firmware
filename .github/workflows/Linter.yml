name: clang-tidy

on: [pull_request]

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Arm Toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '12.2.Rel1'

    - name: Configure
      run: cmake --preset Debug

    - name: Get changed C/C++ files
      id: changed
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **/*.c
          **/*.cc
          **/*.cpp
          **/*.cxx

    - name: Auto-fix
      if: steps.changed.outputs.any_changed == 'true'
      run: |
        clang-tidy \
          -p build/Debug \
          ${{ steps.changed.outputs.all_changed_files }} \
          --fix \
          --quiet

    - name: Fail
      if: steps.changed.outputs.any_changed == 'true'
      run: |
        clang-tidy \
          -p build/Debug \
          ${{ steps.changed.outputs.all_changed_files }} \
          --warnings-as-errors='*' \
          --quiet

