name: Perl Critic
run-name: Perl Critic Linting - ${{ github.ref_name }}

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  perllinter:
    name: Perl Linter
    runs-on: ubuntu-slim
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          install-modules: 'Perl::Critic'

      - name: Perl Critic Output
        run: |
          set -o pipefail
          violations_found=0
          while IFS= read -r file; do
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><code>$file</code></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            if ! perlcritic "$file" 2>&1 | tee -a $GITHUB_STEP_SUMMARY; then
              violations_found=1
            fi
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          done < <(git ls-files '*.pl' '*.pm')
          exit $violations_found

      - name: Perl Critic Annotations
        if: always()
        run: |
          set -o pipefail
          git ls-files '*.pl' '*.pm' \
            | xargs -r perlcritic --verbose '%f:%l:%c:%s:%m (%p)\n' \
            | while IFS= read -r line; do
                file=$(echo "$line" | cut -d: -f1)
                linenum=$(echo "$line" | cut -d: -f2)
                col=$(echo "$line" | cut -d: -f3)
                severity=$(echo "$line" | cut -d: -f4)
                message=$(echo "$line" | cut -d: -f5-)

                if [ -z "$file" ] || [ -z "$linenum" ]; then
                  continue
                fi

                if [ "$severity" = "5" ]; then
                  echo "::error file=$file,line=$linenum,col=$col::$message"
                elif [ "$severity" = "4" ] || [ "$severity" = "3" ]; then
                  echo "::warning file=$file,line=$linenum,col=$col::$message"
                else
                  echo "::notice file=$file,line=$linenum,col=$col::$message"
                fi
              done
