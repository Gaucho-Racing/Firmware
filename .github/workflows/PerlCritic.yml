name: Perl Critic
run-name: Perl Critic Linting - ${{ github.ref_name }}

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  perlcritic:
    name: Lint Perl
    runs-on: ubuntu-slim
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Perl Critic
        uses: perl-actions/install-with-cpanm@v1
        with:
          install: 'Perl::Critic'

      - name: Run Perl Critic
        id: run_perl_critic
        run: |
          set -o pipefail
          git ls-files '*.pl' '*.pm' \
            | xargs -r perlcritic --verbose '%f:%l:%c:%m (%p)\n' \
            | jq -R -s '
                split("\n")
                | map(
                    select(length > 0)
                    | match("^([^:]+):([^:]+):([^:]+):(.+)$")
                    | {
                        file: .captures[0].string,
                        line: (.captures[1].string | tonumber),
                        start_column: (.captures[2].string | tonumber),
                        end_column: (.captures[2].string | tonumber),
                        annotation_level: "failure",
                        message: .captures[3].string
                      }
                  )
              ' \
            | tee perlcritic_annotation.json

      - name: Annotate Files
        if: always()
        uses: yuzutech/annotations-action@v0.5.0
        with:
          repo-token: ${{ github.token }}
          input: 'perlcritic_annotation.json'
