name: CodeQL
run-name: CodeQL - ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  codeql:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - languages: 'c-cpp'
          build_mode: 'manual'
        - languages: 'actions'
          build_mode: 'none'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Trap Cache Directory
        if: matrix.build_mode == 'manual'
        run: mkdir -p /home/runner/work/_temp/trapCaches/cpp/tarballs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.languages }}
          build-mode: ${{ matrix.build_mode }}

      - name: Install Arm Toolchain
        if: matrix.build_mode == 'manual'
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.2.Rel1'

      - name: Build CodeQL Database
        if: matrix.build_mode == 'manual'
        run: make MinSizeRel -j$(nproc)

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4
